[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-agent-router"
version = "0.1.0"
description = "Explicit routing policy over synthetic stand-ins"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
art = "art.cli:main"

[tool.setuptools.package-data]
art = ["profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
